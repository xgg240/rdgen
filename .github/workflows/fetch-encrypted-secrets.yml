name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url:
        required: true
        type: string

jobs:
  create-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse zip URL from JSON
        id: parse
        run: |
          echo "ZIP_JSON=${{ inputs.zip_url }}" >> $GITHUB_ENV
          echo "Extracted zip_url from rdgen server response"

      - name: Download encrypted zip from rdgen server
        run: |
          # Parse the JSON response from rdgen generator
          # zip_url is: {"url": "http://...", "file": "secrets_<uuid>.zip"}
          ZIP_URL="${{ inputs.zip_url }}"
          SERVER_URL=$(echo "$ZIP_URL" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['url'])")
          ZIP_FILE=$(echo "$ZIP_URL" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['file'])")
          FULL_URL="${SERVER_URL}/get_zip?filename=${ZIP_FILE}"
          echo "Downloading from: $FULL_URL"
          curl -L -o secrets.zip "$FULL_URL"
          echo "Downloaded secrets.zip"

      - name: Fix filename for decrypt action
        uses: ./.github/actions/fix-zip

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1
