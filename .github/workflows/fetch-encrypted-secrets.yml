name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url_json:
        required: false
        type: string
      zip_url_base:
        required: false
        type: string
      zip_filename:
        required: false
        type: string

jobs:
  create-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download encrypted zip from rdgen server
        run: |
          # Support both old format (zip_url_json) and new format (zip_url_base + zip_filename)
          JSON_STR='${{ inputs.zip_url_json }}'
          if [ -n "$JSON_STR" ]; then
            FULL_URL=$(echo "$JSON_STR" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['url']+'/get_zip?filename='+d['file'])")
          else
            FULL_URL="${{ inputs.zip_url_base }}/get_zip?filename=${{ inputs.zip_filename }}"
          fi
          echo "Downloading from: $FULL_URL"
          curl -L -o secrets.zip "$FULL_URL"
          echo "Downloaded secrets.zip"

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1
