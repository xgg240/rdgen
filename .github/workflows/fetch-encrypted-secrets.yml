name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url:
        required: true
        type: string

jobs:
  create-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Download encrypted zip from URL
        run: |
          curl -L -o secrets.zip "${{ inputs.zip_url }}"
          echo "Downloaded secrets.zip"

      - name: Fix filename for decrypt action
        run: |
          python3 -c "
import zipfile, os, shutil
# Read the downloaded zip
with zipfile.ZipFile(\"secrets.zip\", \"r\") as zin:
    names = zin.namelist()
    print(\"Files in zip:\", names)
    # Extract and rename config.json to secrets.json
    with zipfile.ZipFile(\"fixed.zip\", \"w\", compression=zipfile.ZIP_DEFLATED) as zout:
        for name in names:
            data = zin.read(name)
            new_name = \"secrets.json\" if name == \"config.json\" else name
            zout.writestr(new_name, data)
            print(f\"  {name} -> {new_name}\")
os.replace(\"fixed.zip\", \"secrets.zip\")
print(\"Fixed zip created\")
"

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1

